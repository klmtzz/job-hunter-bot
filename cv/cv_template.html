<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} - CV</title>
    <style>
        :root {
            --primary: #0f172a;      /* Slate 900 */
            --accent: #2563eb;       /* Blue 600 */
            --text-main: #334155;    /* Slate 700 */
            --text-muted: #64748b;   /* Slate 500 */
            --bg-pill: #f1f5f9;      /* Slate 100 */
            --border: #cbd5e1;       /* Slate 300 */
            --border-light: #e2e8f0; /* Slate 200 */
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 35px 40px;
            font-size: 11.5px;
            line-height: 1.5;
            background: white;
            width: 210mm;
            height: 297mm;
        }
        
        @media print {
            body {
                padding: 12mm 16mm;
                width: 210mm;
                height: 297mm;
            }
            .no-print {
                display: none;
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        
        .name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 3px 0;
            letter-spacing: -0.03em;
        }
        
        .role {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--accent);
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        
        .contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            font-size: 10.5px;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .contact-item svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            flex-shrink: 0;
        }
        
        .contact-item[data-type="github"] svg,
        .contact-item[data-type="linkedin"] svg {
            fill: var(--text-muted);
            stroke: none;
        }
        
        .contact-item a {
            color: var(--text-main);
            text-decoration: none;
        }
        
        .contact-item a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        
        .divider {
            border: 0;
            height: 1px;
            background: var(--border-light);
            margin: 0 0 12px 0;
        }
        
        .section {
            margin-bottom: 12px;
        }
        
        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 6px 0;
            border-bottom: 1.5px solid var(--primary);
            padding-bottom: 2px;
        }
        
        .summary-text {
            font-size: 11px;
            margin: 0;
            text-align: justify;
            color: var(--text-main);
        }
        
        /* Tech Stack Layout */
        .tech-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .tech-category {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        
        .tech-category-name {
            font-weight: 600;
            color: var(--primary);
            min-width: 120px;
            font-size: 11px;
            padding-top: 1px;
        }
        
        .tech-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .tech-pill {
            background: var(--bg-pill);
            color: var(--primary);
            padding: 1.5px 6px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 500;
        }
        
        /* Projects Layout */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .project-item {
            display: flex;
            flex-direction: column;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }
        
        .project-title {
            font-weight: 700;
            font-size: 12px;
            color: var(--primary);
        }
        
        .project-tech {
            font-size: 10.5px;
            color: var(--accent);
            font-weight: 600;
        }
        
        .project-desc {
            font-size: 11px;
            margin: 0 0 2px 0;
        }
        
        .project-link {
            font-size: 10px;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        
        .project-link svg {
            width: 10px;
            height: 10px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        
        .project-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        
        /* Experience Layout */
        .exp-item {
            margin-bottom: 6px;
        }
        
        .exp-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        
        .exp-role {
            font-weight: 700;
            font-size: 12px;
            color: var(--primary);
        }
        
        .exp-meta {
            font-size: 10.5px;
            color: var(--text-muted);
        }
        
        .bullets {
            margin: 2px 0 0 0;
            padding-left: 16px;
            font-size: 11px;
        }
        
        .bullets li {
            margin-bottom: 2px;
        }
        
        /* General content lists */
        .simple-list {
            margin: 0;
            padding-left: 16px;
            font-size: 11px;
        }
        
        .simple-list li {
            margin-bottom: 2px;
        }
        
        /* Education Layout */
        .edu-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        
        .edu-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        
        .edu-school {
            font-weight: 700;
            font-size: 12px;
            color: var(--primary);
        }
        
        .edu-meta {
            font-size: 10.5px;
            color: var(--text-muted);
        }
        
        .edu-degree {
            font-size: 11px;
        }
        
        .availability-text {
            font-size: 11px;
            font-weight: 500;
        }
        
        strong {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="name">{{ name }}</h1>
        <div class="role">{{ role }}</div>
        <div class="contacts">
            {{ contacts_html }}
        </div>
    </div>
    
    <hr class="divider">
    
    <div class="content">
        {{ content_html }}
    </div>
</body>
</html>
