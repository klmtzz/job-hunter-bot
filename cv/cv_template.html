<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} - CV</title>
    <style>
        :root {
            --primary: #0f172a;       /* Dark slate */
            --accent: #2563eb;        /* Electric Royal Blue */
            --accent-light: #eff6ff;  /* Light Blue tint */
            --text-main: #334155;     /* Slate 700 */
            --text-muted: #64748b;    /* Slate 500 */
            --bg-card: #f8fafc;       /* Slate 50 */
            --border: #e2e8f0;        /* Slate 200 */
        }
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 16px 24px;
            font-size: 9.8px;
            line-height: 1.36;
            background: white;
            width: 210mm;
            box-sizing: border-box;
        }
        
        @media print {
            @page {
                size: A4 portrait;
                margin: 0mm;
            }
            body {
                padding: 7mm 10mm;
                width: 210mm;
                height: 297mm;
                max-height: 297mm;
                overflow: hidden;
            }
            .no-print {
                display: none;
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 6px;
        }
        
        .name {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 1px 0;
            letter-spacing: -0.02em;
        }
        
        .role {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 9.5px;
            color: var(--text-main);
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            padding: 2px 7px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 500;
        }
        
        .contact-item svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            flex-shrink: 0;
        }
        
        .contact-item[data-type="github"] svg,
        .contact-item[data-type="linkedin"] svg {
            fill: var(--accent);
            stroke: none;
        }
        
        .contact-item a {
            color: var(--text-main);
            text-decoration: none;
        }
        
        .divider {
            border: 0;
            height: 2px;
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #e2e8f0 100%);
            margin: 6px 0 8px 0;
            border-radius: 2px;
        }
        
        .section {
            margin-bottom: 8px;
            page-break-inside: avoid;
        }
        
        .section-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .section-title::before {
            content: "";
            display: inline-block;
            width: 3.5px;
            height: 11px;
            background: var(--accent);
            border-radius: 2px;
        }
        
        /* Profile Callout Box */
        [class*="generic-"] .summary-text,
        .summary-text {
            background: var(--bg-card);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 0 5px 5px 0;
            font-size: 9.5px;
            line-height: 1.4;
            color: var(--text-main);
            margin: 0 0 3px 0;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        
        /* Tech Stack Layout */
        .tech-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }
        
        .tech-category {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .tech-category-name {
            font-weight: 700;
            color: var(--primary);
            min-width: 125px;
            font-size: 9.5px;
        }
        
        .tech-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        
        .tech-pill {
            background: #ffffff;
            color: #1e40af;
            border: 1px solid #dbeafe;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
        }
        
        /* Project Cards */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            page-break-inside: avoid;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        
        .project-title {
            font-weight: 800;
            font-size: 10.5px;
            color: var(--primary);
        }
        
        .project-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        
        .proj-badge {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            font-size: 8.5px;
            font-weight: 700;
            padding: 0.5px 4px;
            border-radius: 3px;
        }
        
        .project-bullets {
            margin: 2px 0 3px 0;
            padding-left: 13px;
            font-size: 9.5px;
        }
        
        .project-bullets li {
            margin-bottom: 1.5px;
            color: var(--text-main);
        }
        
        .project-bullets code,
        .project-card code {
            background: #e2e8f0;
            color: #0f172a;
            padding: 0.5px 3px;
            border-radius: 2px;
            font-size: 9px;
            font-family: monospace;
        }
        
        .project-link {
            font-size: 9px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 1.5px 6px;
            border-radius: 3px;
        }
        
        .project-link svg {
            width: 9px;
            height: 9px;
            fill: currentColor;
        }
        
        /* Experience */
        .exp-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            margin-bottom: 4px;
            page-break-inside: avoid;
        }
        
        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }
        
        .exp-role {
            font-weight: 800;
            font-size: 10.5px;
            color: var(--primary);
        }
        
        .exp-meta {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .bullets {
            margin: 2px 0 0 0;
            padding-left: 13px;
            font-size: 9.5px;
        }
        
        .bullets li {
            margin-bottom: 1.5px;
        }

        .simple-list {
            margin: 0;
            padding-left: 13px;
            font-size: 9.5px;
        }
        .simple-list li {
            margin-bottom: 1.5px;
        }
        
        /* Education Layout */
        .edu-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            page-break-inside: avoid;
        }
        
        .edu-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        
        .edu-school {
            font-weight: 800;
            font-size: 10.5px;
            color: var(--primary);
        }
        
        .edu-meta {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .edu-degree {
            font-size: 9.5px;
            color: var(--text-main);
        }
        
        strong {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="name">{{ name }}</h1>
        <div class="role">{{ role }}</div>
        <div class="contacts">
            {{ contacts_html }}
        </div>
    </div>
    
    <hr class="divider">
    
    <div class="content">
        {{ content_html }}
    </div>
</body>
</html>
